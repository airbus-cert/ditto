[workspace]
members = [
    "core",
    "crates/*"
]
resolver = "3"

[workspace.dependencies]
log = "0.4"

[workspace.package]
authors = ["Airbus CERT <cert@airbus.com>"]
description = "A script obfuscator"
repository = "https://github.com/airbus-cert/ditto"
readme = "README.md"
license = "MIT"

[profile.dittojs-release]
inherits = "release"
lto = false
panic = "abort"